# Pull secrets from Infisical into CI
# Requires: INFISICAL_TOKEN (machine identity service token) stored in repo secrets
# Docs: https://infisical.com/docs/cli/usage

name: Infisical Sync

on:
  workflow_call:
  workflow_dispatch:

jobs:
  sync-secrets:
    name: Pull secrets from Infisical
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Infisical CLI
        shell: bash
        run: |
          set -euo pipefail
          version="0.43.128"
          checksum="a3f460be321ad46fefba99cba883bcc601d0f18b02849d2d30ae9b398a8d99dc"
          archive="$RUNNER_TEMP/infisical-cli.tar.gz"
          install_dir="$RUNNER_TEMP/infisical-cli"
          url="https://github.com/Infisical/cli/releases/download/v${version}/cli_${version}_linux_amd64.tar.gz"

          mkdir -p "$install_dir/bin"
          curl --fail --location --proto '=https' --tlsv1.2 --silent --show-error \
            "$url" --output "$archive"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_dir" infisical
          install -m 0755 "$install_dir/infisical" "$install_dir/bin/infisical"
          echo "$install_dir/bin" >> "$GITHUB_PATH"

      - name: Validate Infisical environment
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID || secrets.INFISICAL_PROJECT_ID || '8efe392e-56a6-4c3c-89f9-8141183dd7e8' }}
          INFISICAL_ENV: ${{ vars.INFISICAL_ENV || github.ref == 'refs/heads/main' && 'prod' || github.ref == 'refs/heads/staging' && 'staging' || 'dev' }}
        run: |
          # Validate required secrets are present
          if [ -z "$INFISICAL_TOKEN" ]; then
            echo "::error::INFISICAL_TOKEN secret not configured in repo settings"
            exit 1
          fi
          if [ -z "$INFISICAL_PROJECT_ID" ]; then
            echo "::error::INFISICAL_PROJECT_ID var or secret not set"
            exit 1
          fi

          # Validate the fetched environment without writing values to the log.
          infisical run \
            --projectId "$INFISICAL_PROJECT_ID" \
            --env "$INFISICAL_ENV" \
            --token "$INFISICAL_TOKEN" \
            -- bash -c 'true'
