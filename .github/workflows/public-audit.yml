name: Public audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "9.0.x"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: CivicSurvival/UI/package-lock.json
      - name: Public policy checks
        run: node scripts/ci/check-public-audit.mjs .
      - name: Contracts build and audit runner
        run: |
          bash tests/public-audit/test_contracts_build.sh
          bash tests/public-audit/test_runner.sh
      - name: UI dependency install
        working-directory: CivicSurvival/UI
        run: npm ci --ignore-scripts
      - name: UI unit and lint-rule tests
        working-directory: CivicSurvival/UI
        run: |
          npm run test:ui
          npm run test:lint-rules
          npm run typecheck:declarations
          npm run lint:strict
      - name: Production dependency audit
        working-directory: CivicSurvival/UI
        run: npm audit --omit=dev --audit-level=high
