# Mergify Configuration — Optimized for multi-language monorepos
# Docs: https://docs.mergify.com/

pull_request_rules:
  # Auto-merge non-draft main PRs when all protected checks pass
  - name: Auto-merge when protected checks are green
    conditions:
      - base=main
      - -draft
      - check-success = "Civic Evidence Gate"
      - check-success = "Security Scan"
      - check-success = "Dependency Delta"
      - check-success = "ci / lint"
      - check-success = "ci / test"
      - -conflict
      - -closed
    actions:
      merge:
        method: squash
        commit_message_template: |
          {{ title }} (#{{ number }})

          Co-authored-by: {{ author }}

  # Bot auto-merge rules are intentionally absent. The repository has no
  # verified Mergify identities for those accounts; retaining them makes the
  # whole ruleset invalid and would weaken the protected-flow auditability.

  # Label PRs based on changed files
  - name: Label Python changes
    conditions:
      - files~=\.py$
    actions:
      label:
        add:
          - python

  - name: Label Rust changes
    conditions:
      - files~=\.rs$|Cargo\.
    actions:
      label:
        add:
          - rust

  - name: Label Go changes
    conditions:
      - files~=\.go$|go\.
    actions:
      label:
        add:
          - go

  - name: Label TypeScript changes
    conditions:
      - files~=\.ts$|\.tsx$|package\.json
    actions:
      label:
        add:
          - typescript

  # Warn on large PRs
  - name: Warn on large PRs
    conditions:
      - -closed
      - -draft
      - "#files>20"
    actions:
      comment:
        message: >
          **Large PR Alert**: This PR touches {{ number }} files.
          Consider splitting into smaller PRs for easier review.

  # Add ready-to-merge label when all checks pass
  - name: Add ready-to-merge label
    conditions:
      - base=main
      - -closed
      - -draft
      - -conflict
      - check-success = "Civic Evidence Gate"
      - check-success = "Security Scan"
      - check-success = "Dependency Delta"
      - check-success = "ci / lint"
      - check-success = "ci / test"
    actions:
      label:
        add:
          - ready-to-merge
