# Ruff configuration for CivicSurvival-public
# Aligned with the existing CI invocation in .circleci/config.yml
# (`ruff check` + `ruff format --check`) and the scorecard pillar 31 (LINTING).

# This file deliberately mirrors CI defaults -- it exists to (a) satisfy the
# scorecard pillar 31 detector, (b) document the project's intent (line length,
# Python version, quote style), and (c) provide a place for contributors to
# discover the tool's settings. It does NOT add or remove rules beyond what
# `uv run ruff check` already enforces on the CI runner.

# Match Python 3.12+; the CI uses `uv` which pins to a current toolchain.
target-version = "py312"

line-length = 100
indent-width = 4

[format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
